name: Publish data
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "data/**"
  workflow_run:
    workflows:
      - "Refresh ENTSO-E data"
      - "Refresh KAS data"
      - "Refresh customs data"
      - "Refresh KQZ data"
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the latest commit on the branch; workflow_run.head_sha does not
          # include commits pushed by the workflow itself.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./data
      - uses: actions/deploy-pages@v4
