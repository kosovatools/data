name: Refresh KAS data
on:
  schedule: [{ cron: "0 4 * * *" }] # daily 04:00 UTC
  workflow_dispatch:
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check KAS endpoint availability
        run: |
          status=$(curl -I --retry 3 --retry-delay 5 --max-time 15 -o /dev/null -w '%{http_code}' https://askdata.rks-gov.net/ 2>/dev/null || echo "000")
          if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
            echo "KAS endpoint reachable (status: $status)."
            exit 0
          fi
          echo "KAS endpoint not reachable (status: $status)."
          exit 1

      - uses: pnpm/action-setup@v4
        with: { version: 10.4.1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Fetch KAS PxWeb datasets
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}
        run: pnpm run generate:kas

      - name: Commit data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/kas
          datasets=$(git diff --cached --name-only -- data/kas | sed 's|^data/kas/||; s|\.json$||' | paste -sd ", " -)
          if [ -z "$datasets" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update KAS data (${datasets})"
          git push
